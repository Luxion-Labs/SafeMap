<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="safemap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C060B" />
      <stop offset="50%" stop-color="#1A0C16" />
      <stop offset="100%" stop-color="#080407" />
    </linearGradient>
    <linearGradient id="crimson-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="sonar-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0C060B" stop-opacity="0" />
    </radialGradient>
    <pattern id="geo-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#EF4444" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#safemap-bg)" />
  <rect width="1200" height="420" fill="url(#sonar-glow)" />
  <rect width="1200" height="420" fill="url(#geo-grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.2" />

  <!-- Geospatial Radar / Shield Art (Right Side) -->
  <g transform="translate(840, 210)">
    <!-- Concentric Radar Scan Circles -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="60" fill="#EF4444" fill-opacity="0.06" stroke="#EF4444" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Radar Sweep Needle -->
    <line x1="0" y1="0" x2="100" y2="-70" stroke="#EF4444" stroke-width="2" stroke-opacity="0.8" />
    <polygon points="0,0 95,-75 105,-60" fill="#EF4444" fill-opacity="0.15" />

    <!-- Central Safety Shield Node -->
    <g transform="translate(0, -5)">
      <path d="M 0 -35 L 28 -20 L 28 8 Q 28 28 0 40 Q -28 28 -28 8 L -28 -20 Z" fill="#1A0711" stroke="#EF4444" stroke-width="2.5" />
      <circle cx="0" cy="-2" r="7" fill="#F59E0B" />
      <path d="M 0 5 L 0 16" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Radiating Incident Alert Beacons -->
    <g transform="translate(-75, -50)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="0" cy="0" r="4" fill="#EF4444" />
    </g>
    <g transform="translate(85, 45)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="0" cy="0" r="5" fill="#10B981" />
    </g>
    <g transform="translate(-60, 65)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8" />
      <circle cx="0" cy="0" r="3.5" fill="#F59E0B" />
    </g>

    <text x="-80" y="155" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1">RADAR: PERIMETER_SHIELDED</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="240" height="30" rx="15" fill="#EF4444" fill-opacity="0.12" stroke="#EF4444" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#EF4444" />
    <text x="28" y="19" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ANONYMOUS COMMUNITY SAFETY</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      SafeMap
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#crimson-amber)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Anonymous community safety platform turning plain language reports into real-time risk maps.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Zero account requirement, zero tracking, and zero raw text stored in databases.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">CORE: FASTAPI + LEAFLET</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">NLP: ENTITY EXTRACTION</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>